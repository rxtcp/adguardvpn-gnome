name: Checks

on:
  push:
  pull_request:

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build and test dependencies
        run: |
          npm ci
          python3 -m pip install -r requirements-dev.txt
      - name: Shell syntax
        run: |
          for script in scripts/*.sh helper/client.sh; do
            bash -n "$script"
          done
      - name: TypeScript and extension behavior with full coverage
        run: npm run test:coverage
      - name: Helper behavior and installation archive
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m coverage run -m unittest discover -s tests -v
          python3 -m coverage report
      - name: Polkit XML syntax
        run: python3 -c 'import xml.etree.ElementTree as ET; ET.parse("helper/org.gnome.adguardvpn.control.policy")'
