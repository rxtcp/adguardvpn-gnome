name: Checks

on:
  push:
  pull_request:

jobs:
  static-and-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install build and test dependencies
        run: |
          npm ci
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gi python3-venv
          /usr/bin/python3 -m venv --system-site-packages .tmp/python-env
          .tmp/python-env/bin/python -m pip install -r requirements-dev.txt
      - name: Shell syntax
        run: |
          for script in scripts/*.sh helper/client.sh; do
            bash -n "$script"
          done
      - name: TypeScript and extension behavior with full coverage
        run: npm run test:coverage
      - name: Helper behavior and installation archive
        run: |
          PYTHONDONTWRITEBYTECODE=1 .tmp/python-env/bin/python -m coverage run -m unittest discover -s tests -v
          .tmp/python-env/bin/python -m coverage report
      - name: Polkit XML syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in [*Path('helper').glob('*.policy'), *Path('routing_system').glob('*.policy'), *Path('routing_system').glob('org*.conf')]:
              ET.parse(path)
          PY
  routing-namespace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install namespace test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iproute2 nftables python3-idna
      - name: Exercise real IPv4 and IPv6 routing and nftables in an isolated network namespace
        run: |
          parent_namespace="$(readlink /proc/self/ns/net)"
          sudo env SITE_ROUTING_PARENT_NETNS="$parent_namespace" unshare --net /usr/bin/python3 -m unittest discover -s tests -p site_routing_namespace.py -v

  openvpn-adapter:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install adapter build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake autopoint gettext libtool libglib2.0-dev libnm-dev \
            libcap-ng-dev liblz4-dev liblzo2-dev libssl-dev
      - name: Build the two patched OpenVPN components
        run: |
          mkdir -p .tmp/upstream
          curl -fsSL https://codeload.github.com/NetworkManager/NetworkManager-openvpn/tar.gz/refs/tags/1.12.0 \
            | tar -xz -C .tmp/upstream
          curl -fsSL https://codeload.github.com/OpenVPN/openvpn/tar.gz/refs/tags/v2.6.14 \
            | tar -xz -C .tmp/upstream
          patch -d .tmp/upstream/NetworkManager-openvpn-1.12.0 -p1 < packaging/NetworkManager-openvpn-1.12.0-site-routing.patch
          patch -d .tmp/upstream/openvpn-2.6.14 -p1 < packaging/openvpn-2.6.14-site-routing.patch
          (
            cd .tmp/upstream/NetworkManager-openvpn-1.12.0
            autoreconf -fi
            ./configure --without-gnome
            make -j2 src/nm-openvpn-service
          )
          (
            cd .tmp/upstream/openvpn-2.6.14
            autoreconf -fi
            ./configure --disable-dco --disable-plugin-auth-pam --disable-plugin-down-root
            make -j2
            src/openvpn/openvpn --version > version.txt
            grep -F '[SiteRouting-SO_MARK]' version.txt
          )
